<!DOCTYPE html>
<html lang="ru">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    {% seo %}
    <link rel="stylesheet" href="{{ "/assets/css/style.css?v=" | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    <div class="container-lg px-3 my-5 markdown-body">
      {{ content }}
    </div>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/anchor-js/4.1.0/anchor.min.js" integrity="sha256-lZa0ETZfradhGCNTXQgOkQTNDZ4pJ8UJ0Zf4705gySg=" crossorigin="anonymous"></script>
    <script>
      anchors.add();
      document.addEventListener('DOMContentLoaded', function() {
        var links = document.querySelectorAll('.markdown-body a');
        links.forEach(function(link) {
          var href = link.getAttribute('href');
          if (!href) return;
          // Keep internal page anchors in the current view
          if (href.startsWith('#')) return;
          
          // Open external and resource links in a new tab
          link.setAttribute('target', '_blank');
          link.setAttribute('rel', 'noopener noreferrer');
          
          // Trigger file download for PDFs
          if (href.endsWith('.pdf') || href.includes('/downloads/')) {
            link.setAttribute('download', '');
          }
        });
      });
    </script>
  </body>
</html>
